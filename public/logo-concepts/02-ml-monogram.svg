<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <style>
      .logo-text { font-family: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif; }
    </style>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B4332"/>
      <stop offset="100%" stop-color="#2D6A4F"/>
    </linearGradient>
  </defs>

  <!-- Circular monogram mark -->
  <g transform="translate(80, 80)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="58" fill="url(#grad)"/>
    <!-- Gold accent arc (top-right quarter) -->
    <path d="M 41 -41 A 58 58 0 0 1 58 0" fill="none" stroke="#D4A843" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Inner subtle ring -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

    <!-- ML letterforms -->
    <text x="-2" y="14" text-anchor="middle" font-family="'Source Sans 3','Segoe UI',system-ui,sans-serif" font-weight="800" font-size="52" fill="#FFFFFF" letter-spacing="-3">
      ML
    </text>
  </g>

  <!-- Wordmark to the right -->
  <text x="160" y="58" class="logo-text" font-weight="800" font-size="26" fill="#1B4332" letter-spacing="-0.5">
    Za lepší
  </text>
  <text x="160" y="88" class="logo-text" font-weight="800" font-size="26" fill="#2D6A4F" letter-spacing="-0.5">
    Mariánské Lázně
  </text>

  <!-- Subtle tagline -->
  <text x="160" y="112" class="logo-text" font-weight="700" font-size="11" fill="#D4A843" letter-spacing="2.2">
    KOMUNÁLNÍ VOLBY 2026
  </text>
</svg>
