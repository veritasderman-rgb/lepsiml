<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <style>
      .logo-text { font-family: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif; }
    </style>
    <linearGradient id="leafGrad" x1="0" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#40916C"/>
    </linearGradient>
  </defs>

  <!-- Rising leaf/arrow mark -->
  <g transform="translate(55, 80)">
    <!-- Main leaf shape — upward pointing, asymmetric for dynamism -->
    <path d="M 0 48 Q 0 -10 24 -48 Q 28 -20 48 0 Q 20 0 0 48Z" fill="url(#leafGrad)"/>
    <!-- Second leaf (lighter, behind) -->
    <path d="M -4 48 Q -16 0 -4 -36 Q 0 -12 16 4 Q 0 12 -4 48Z" fill="#B7E4C7" opacity="0.6"/>
    <!-- Vein / stem line -->
    <path d="M 0 46 Q 6 10 24 -44" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    <!-- Gold water drop at base -->
    <ellipse cx="2" cy="56" rx="6" ry="7" fill="#D4A843"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(120, 0)">
    <text x="0" y="48" class="logo-text" font-weight="800" font-size="18" fill="#D4A843" letter-spacing="3">
      ZA LEPŠÍ
    </text>
    <text x="0" y="82" class="logo-text" font-weight="800" font-size="32" fill="#1B4332" letter-spacing="-0.8">
      Mariánské Lázně
    </text>

    <!-- Accent line -->
    <line x1="0" y1="92" x2="54" y2="92" stroke="#D4A843" stroke-width="3" stroke-linecap="round"/>

    <!-- Campaign tag -->
    <text x="0" y="118" class="logo-text" font-weight="600" font-size="12" fill="#5A6B63" letter-spacing="1.5">
      Komunální volby 2026
    </text>
  </g>
</svg>
