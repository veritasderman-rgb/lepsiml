<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0a1a18"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="-50" r="320" fill="#00b2a9" opacity="0.10"/>
  <circle cx="100" cy="700" r="280" fill="#00b2a9" opacity="0.06"/>

  <!-- Logo mark — top left -->
  <g transform="translate(80, 60)">
    <circle cx="55" cy="55" r="50" fill="none" stroke="#ffffff" stroke-width="4.5"/>
    <g fill="#ffffff">
      <rect x="32" y="20" width="6.6" height="61" rx="1"/>
      <path d="M 38.5 20 H 68.5 Q 86 20 86 34.5 V 42 Q 86 56 68.5 56 H 38.5 Z"/>
    </g>
    <path d="M 45 28 H 66 Q 77 28 77 38 Q 77 47 66 47 H 45 Z" fill="#000000"/>
    <path fill="#ffffff" d="M 17 88 V 81 H 24 V 77 H 31 V 81 H 37 V 70 H 44 V 62 H 47 V 55 H 50 V 62 H 53 V 70 H 60 V 66 H 67 V 70 H 74 V 77 H 80 V 81 H 87 V 77 H 93 V 88 Z"/>
  </g>

  <!-- Campaign label -->
  <text x="80" y="225" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="700" font-size="22" fill="#00b2a9" letter-spacing="4">
    KOMUNÁLNÍ VOLBY 2026
  </text>

  <!-- Main headline -->
  <text x="80" y="315" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="800" font-size="82" fill="#FFFFFF" letter-spacing="-2">
    Mariánské Lázně
  </text>
  <text x="80" y="410" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="800" font-size="82" fill="#FFFFFF" letter-spacing="-2">
    si zaslouží víc!
  </text>

  <!-- Teal accent line -->
  <rect x="80" y="435" width="120" height="5" rx="3" fill="#00b2a9"/>

  <!-- Subheadline -->
  <text x="80" y="490" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="600" font-size="28" fill="#b3ebe5">
    Hrdé město. Pro rodiny i mladé. Otevřené, udržitelné, naše.
  </text>

  <!-- Bottom bar -->
  <rect x="0" y="540" width="1200" height="90" fill="rgba(0,0,0,0.45)"/>
  <text x="80" y="595" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="800" font-size="30" fill="#FFFFFF">
    Za lepší Mariánské Lázně
  </text>
  <text x="1120" y="595" text-anchor="end" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="600" font-size="22" fill="#00b2a9">
    lepsiml.cz
  </text>
</svg>
