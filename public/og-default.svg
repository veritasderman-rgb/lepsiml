<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2D4A"/>
      <stop offset="100%" stop-color="#1E56A0"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#1E56A0"/>
      <stop offset="100%" stop-color="#3B7DD8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="-50" r="320" fill="#3B7DD8" opacity="0.08"/>
  <circle cx="100" cy="700" r="280" fill="#B8D4F0" opacity="0.06"/>

  <!-- Logo mark (leaf) — top left -->
  <g transform="translate(80, 70)">
    <path d="M 0 44 Q 0 -10 22 -44 Q 25 -19 44 0 Q 19 0 0 44Z" fill="url(#leaf)"/>
    <path d="M -3 44 Q -13 0 -3 -30 Q 0 -9 13 3 Q 0 9 -3 44Z" fill="#B8D4F0" opacity="0.5"/>
    <ellipse cx="1.5" cy="52" rx="5" ry="6" fill="#D4A843"/>
  </g>

  <!-- Campaign label -->
  <text x="80" y="180" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="700" font-size="22" fill="#D4A843" letter-spacing="4" text-transform="uppercase">
    KOMUNÁLNÍ VOLBY 2026
  </text>

  <!-- Main headline -->
  <text x="80" y="270" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="800" font-size="82" fill="#FFFFFF" letter-spacing="-2">
    Mariánské Lázně
  </text>
  <text x="80" y="365" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="800" font-size="82" fill="#FFFFFF" letter-spacing="-2">
    si zaslouží víc!
  </text>

  <!-- Gold accent line -->
  <rect x="80" y="390" width="120" height="5" rx="3" fill="#D4A843"/>

  <!-- Subheadline -->
  <text x="80" y="445" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="600" font-size="28" fill="#B8D4F0">
    Hrdé město. Pro rodiny i mladé. Otevřené, udržitelné, naše.
  </text>

  <!-- Bottom bar -->
  <rect x="0" y="530" width="1200" height="100" fill="rgba(0,0,0,0.25)"/>
  <text x="80" y="590" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="800" font-size="30" fill="#FFFFFF">
    Za lepší Mariánské Lázně
  </text>
  <text x="1120" y="590" text-anchor="end" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="600" font-size="22" fill="#D4A843">
    lepsiml.cz
  </text>
</svg>
