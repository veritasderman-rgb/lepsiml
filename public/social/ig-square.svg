<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bgIG" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#0F2D4A"/>
      <stop offset="100%" stop-color="#1E56A0"/>
    </linearGradient>
    <linearGradient id="leafIG" x1="0" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#1E56A0"/>
      <stop offset="100%" stop-color="#3B7DD8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bgIG)"/>

  <!-- Decorative circles -->
  <circle cx="900" cy="100" r="250" fill="#3B7DD8" opacity="0.08"/>
  <circle cx="150" cy="950" r="200" fill="#B8D4F0" opacity="0.06"/>

  <!-- Logo mark (leaf) — centered top -->
  <g transform="translate(490, 140)">
    <path d="M 0 72 Q 0 -16 36 -72 Q 41 -30 72 0 Q 31 0 0 72Z" fill="url(#leafIG)"/>
    <path d="M -5 72 Q -21 0 -5 -49 Q 0 -15 21 5 Q 0 15 -5 72Z" fill="#B8D4F0" opacity="0.5"/>
    <path d="M 0 68 Q 8 16 36 -68" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
    <ellipse cx="2.5" cy="84" rx="8" ry="9" fill="#D4A843"/>
  </g>

  <!-- Campaign label -->
  <text x="540" y="310" text-anchor="middle" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="700" font-size="26" fill="#D4A843" letter-spacing="5">
    KOMUNÁLNÍ VOLBY 2026
  </text>

  <!-- Gold line -->
  <rect x="460" y="330" width="160" height="4" rx="2" fill="#D4A843"/>

  <!-- Main headline — stacked center -->
  <text x="540" y="440" text-anchor="middle" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="800" font-size="74" fill="#FFFFFF" letter-spacing="-1.5">
    Mariánské Lázně
  </text>
  <text x="540" y="530" text-anchor="middle" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="800" font-size="74" fill="#FFFFFF" letter-spacing="-1.5">
    si zaslouží víc!
  </text>

  <!-- Subheadline -->
  <text x="540" y="610" text-anchor="middle" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="600" font-size="28" fill="#B8D4F0">
    Hrdé město. Pro rodiny i mladé.
  </text>
  <text x="540" y="650" text-anchor="middle" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="600" font-size="28" fill="#B8D4F0">
    Otevřené, udržitelné, naše.
  </text>

  <!-- Bottom section — 5 pillars as icons row -->
  <g transform="translate(540, 780)" text-anchor="middle">
    <!-- Five small badges -->
    <g transform="translate(-240, 0)">
      <circle cx="0" cy="0" r="32" fill="rgba(255,255,255,0.08)"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="800" font-size="18" fill="#D4A843">1</text>
      <text x="0" y="55" text-anchor="middle" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="600" font-size="14" fill="rgba(255,255,255,0.75)">Hrdé</text>
      <text x="0" y="72" text-anchor="middle" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="600" font-size="14" fill="rgba(255,255,255,0.75)">město</text>
    </g>
    <g transform="translate(-120, 0)">
      <circle cx="0" cy="0" r="32" fill="rgba(255,255,255,0.08)"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="800" font-size="18" fill="#D4A843">2</text>
      <text x="0" y="55" text-anchor="middle" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="600" font-size="14" fill="rgba(255,255,255,0.75)">Pro</text>
      <text x="0" y="72" text-anchor="middle" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="600" font-size="14" fill="rgba(255,255,255,0.75)">rodiny</text>
    </g>
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="32" fill="rgba(255,255,255,0.08)"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="800" font-size="18" fill="#D4A843">3</text>
      <text x="0" y="55" text-anchor="middle" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="600" font-size="14" fill="rgba(255,255,255,0.75)">UNESCO</text>
      <text x="0" y="72" text-anchor="middle" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="600" font-size="14" fill="rgba(255,255,255,0.75)">destinace</text>
    </g>
    <g transform="translate(120, 0)">
      <circle cx="0" cy="0" r="32" fill="rgba(255,255,255,0.08)"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="800" font-size="18" fill="#D4A843">4</text>
      <text x="0" y="55" text-anchor="middle" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="600" font-size="14" fill="rgba(255,255,255,0.75)">Otevřená</text>
      <text x="0" y="72" text-anchor="middle" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="600" font-size="14" fill="rgba(255,255,255,0.75)">radnice</text>
    </g>
    <g transform="translate(240, 0)">
      <circle cx="0" cy="0" r="32" fill="rgba(255,255,255,0.08)"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="800" font-size="18" fill="#D4A843">5</text>
      <text x="0" y="55" text-anchor="middle" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="600" font-size="14" fill="rgba(255,255,255,0.75)">Zelené</text>
      <text x="0" y="72" text-anchor="middle" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="600" font-size="14" fill="rgba(255,255,255,0.75)">Mariánky</text>
    </g>
  </g>

  <!-- Brand name bottom -->
  <text x="540" y="980" text-anchor="middle" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="800" font-size="32" fill="#FFFFFF">
    Za lepší Mariánské Lázně
  </text>
  <text x="540" y="1020" text-anchor="middle" font-family="'Source Sans 3',system-ui,sans-serif" font-weight="600" font-size="22" fill="#D4A843">
    lepsiml.cz
  </text>
</svg>
